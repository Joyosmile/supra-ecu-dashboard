name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Create Clean App Project
        run: |
          flutter create -t app --org com.supra.ecu --project-name ecu_dashboard_supra clean_project
          cp -f lib/main.dart clean_project/lib/main.dart

      - name: Inject Bluetooth & Internet Permissions
        run: |
          PERMISSIONS='<uses-permission android:name="android.permission.BLUETOOTH"/>\n<uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>\n<uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n<uses-permission android:name="android.permission.BLUETOOTH_SCAN"/>\n<uses-permission android:name="android.permission.INTERNET"/>'
          sed -i "s|<manifest[^>]*>|\0\n$PERMISSIONS|g" clean_project/android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: |
          cd clean_project
          # Menambahkan library Bluetooth dan mengunci versi fl_chart yang cocok dengan Flutter 3.22
          flutter pub add flutter_bluetooth_serial
          flutter pub add fl_chart:0.68.0
          flutter pub get

      - name: Build APK (Release Mode)
        run: |
          cd clean_project
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dashboard-ECU-SupraX125-Graph
          path: clean_project/build/app/outputs/flutter-apk/app-release.apk
